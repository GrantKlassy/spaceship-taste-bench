[package]
name = "terminal-game-taste-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Evaluate coding agents' terminal games through preserved attempts and human reviews"
repository = "https://github.com/GrantKlassy/terminal-game-taste-bench"
readme = "../README.md"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
flate2 = "1.1"
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
toml = "0.9"
uuid = { version = "1.16", features = ["v4"] }
walkdir = "2.5"
