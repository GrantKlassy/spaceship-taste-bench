# Copy to bench.local.toml; never place credentials in this file.
schema_version = 1
backend = "sbx"
sbx = "sbx"
environment = "linux-rust-v2"

[limits]
cpus = 4
memory_mib = 8192
# Total writable virtual disk capacity. Claude reserves 4096 MiB for its
# runtime volumes and needs at least 6144 MiB total; the rest is its root disk.
disk_mib = 20480
export_bytes = 67108864
export_files = 10000
replay_bytes = 1073741824
replay_files = 100000
log_bytes = 268435456
# These are protection limits, never time/token/cost budgets.
